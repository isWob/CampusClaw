{% extends "base.html" %}
{% block title %}登录 · CampusClaw{% endblock %}
{% block content %}
<section class="card login-card">
  <h1>登录</h1>
  <p class="muted">教师与学生使用预置账号登录，班级数据按账号归属隔离。</p>
  {% if error %}
    <p class="flash flash-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('auth.form_login') }}" class="form">
    <label>
      用户名
      <input type="text" name="username" required autocomplete="username"
             value="{{ username or '' }}" autofocus>
    </label>
    <label>
      密码
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary">登录</button>
  </form>
</section>
{% endblock %}
